server
{
	listen 0.0.0.0:8080;
	server_name localhost;
	root www;
	index index.html;
	client_max_body_size 1000000;

	error_page 404 www/errors/404.html;
	error_page 500 www/errors/500.html;

	location / {
		root www;
		index index.html;
		allowed_methods GET POST DELETE;
		autoindex off;
	}

	location /uploads {
		root www;
		upload_dir uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
	}
}
